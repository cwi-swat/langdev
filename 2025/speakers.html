    <title>Langdev 2025 - Speakers</title>
    <link href="../assets/2025/stylesheet.css" rel="stylesheet" />

      href="../assets/2025/favicon/favicon-16x16.png"

    <link

      type="image/png"
      href="../assets/2025/favicon/favicon-32x32.png"
      sizes="32x32"
    />
    <script src="../assets/js/script.js" defer></script>
    <style>
      .speaker {
        display: flex;
        flex-direction: row;
        padding-bottom: 3rem;
        margin-bottom: 4rem;
        border-bottom: 2px solid #7e8b9e;
      }
      .speaker h2 {
        color: var(--accent-color);
      }
      .speaker img {
        margin-top: 5rem;
        margin-right: 4rem;
        width: 12rem;
        height: 12rem;
        filter: grayscale(70%) sepia(70%) hue-rotate(141deg) contrast(1)
          brightness(1) saturate(0.8);
      }
      .speaker .social {
        margin-right: 1rem;
      }
      .speaker .social img {
        margin-top: 1rem;
        margin-right: 0rem;
        width: 1.5rem;
        height: 1.5rem;
      }

      .speaker a.social:hover img {
        filter: grayscale(0%) sepia(100%) hue-rotate(-30deg) saturate(2)
          brightness(1.2);
        transition: filter 0.3s ease;
      }

      h2 {
        text-align: left;
        font-size: 1.3rem;
      }
      .s-affiliation {
        margin-bottom: 2rem;
        font-style: italic;
      }
      .s-title {
        font-size: 1.2rem;
        font-style: normal;
        margin-left: 3rem;
      }
      .s-title a:before {
        content: "◢";
        margin-right: 0.7rem;
      }

      .footer {
        margin-top: 10rem;
      }

      @media (max-width: 480px) {
        .speaker {
          flex-direction: column;
        }
      }
    </style>
  </head>

    <div class="main">
      <div class="top-bar">

        </div>
      </div>
      <div class="content">
        <h1>Speakers will be published on 16/09/2025</h1>
